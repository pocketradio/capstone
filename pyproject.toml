[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ieee-cis-fraud-lab"
version = "0.1.0"
description = "Reproducible IEEE-CIS fraud scoring and delayed-feedback contextual bandit experiments"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

